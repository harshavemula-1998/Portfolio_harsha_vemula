name: Deploy to S3 and CloudFront

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync files to S3
        run: |
          aws s3 sync . s3://portfolio-saiharshavemula \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.md" \
            --exclude ".DS_Store" \
            --delete \
            --cache-control "max-age=31536000,public" \
            --exclude "*.html" \
            --exclude "*.css" \
            --exclude "*.js"

          # Upload HTML, CSS, and JS with shorter cache
          aws s3 sync . s3://portfolio-saiharshavemula \
            --exclude "*" \
            --include "*.html" \
            --include "*.css" \
            --include "*.js" \
            --cache-control "max-age=3600,public" \
            --content-type "text/html; charset=utf-8" \
            --metadata-directive REPLACE

      - name: Deployment summary
        run: |
          echo "Deployment completed successfully"
          echo "Files synced to S3: s3://portfolio-saiharshavemula"
          echo "Website URL: http://portfolio-saiharshavemula.s3-website-us-east-1.amazonaws.com"
          echo "Note: CloudFront distribution will be added once SSL certificate is validated"
