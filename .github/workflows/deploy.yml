name: Deploy to S3 and CloudFront

on:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'

      - name: HTML/CSS/JS Validation
        run: |
          echo "🔍 Running basic file validation..."

          # Check for hardcoded credentials (basic check)
          echo "Checking for potential hardcoded secrets..."
          if grep -rE "(password|secret|api_key|apikey).*=.*['\"][^'\"]+['\"]" \
            --include="*.js" \
            --include="*.html" \
            --exclude="jquery.min.js" \
            --exclude-dir="lib" \
            --exclude-dir="fonts" .; then
            echo "❌ Error: Potential hardcoded credentials found!"
            exit 1
          fi

          # Check for inline event handlers (warning only)
          echo "Checking HTML for inline event handlers..."
          if grep -r "onclick=" --include="*.html" . | grep -v "fonts/"; then
            echo "⚠️  Info: Found inline onclick handlers (chatbot functionality)"
          fi

          echo "✅ Basic validation completed!"

  deploy:
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync files to S3
        run: |
          aws s3 sync . s3://saiharshavemula.com \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.md" \
            --exclude ".DS_Store" \
            --delete \
            --cache-control "max-age=31536000,public" \
            --exclude "*.html" \
            --exclude "*.css" \
            --exclude "*.js"

          # Upload HTML, CSS, and JS with shorter cache
          aws s3 sync . s3://saiharshavemula.com \
            --exclude "*" \
            --include "*.html" \
            --include "*.css" \
            --include "*.js" \
            --cache-control "max-age=3600,public" \
            --content-type "text/html; charset=utf-8" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1NM1JU5WPCOK8 \
            --paths "/*"

      - name: Wait for invalidation to complete
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id E1NM1JU5WPCOK8 \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "Waiting for invalidation $INVALIDATION_ID to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id E1NM1JU5WPCOK8 \
            --id $INVALIDATION_ID

          echo "✅ CloudFront cache invalidated successfully!"

      - name: Deployment summary
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "📦 Files synced to S3: s3://saiharshavemula.com"
          echo "🌐 CloudFront distribution: E1NM1JU5WPCOK8"
          echo "🔗 Website URL: https://saiharshavemula.com"
