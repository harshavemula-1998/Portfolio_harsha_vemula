name: Deploy to S3 and CloudFront

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync files to S3
        run: |
          aws s3 sync . s3://saiharshavemula.com \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.md" \
            --exclude ".DS_Store" \
            --delete \
            --cache-control "max-age=31536000,public" \
            --exclude "*.html" \
            --exclude "*.css" \
            --exclude "*.js"

          # Upload HTML, CSS, and JS with shorter cache
          aws s3 sync . s3://saiharshavemula.com \
            --exclude "*" \
            --include "*.html" \
            --include "*.css" \
            --include "*.js" \
            --cache-control "max-age=3600,public" \
            --content-type "text/html; charset=utf-8" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1NM1JU5WPCOK8 \
            --paths "/*"

      - name: Wait for invalidation to complete
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id E1NM1JU5WPCOK8 \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "Waiting for invalidation $INVALIDATION_ID to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id E1NM1JU5WPCOK8 \
            --id $INVALIDATION_ID

          echo "✅ CloudFront cache invalidated successfully!"

      - name: Deployment summary
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "📦 Files synced to S3: s3://saiharshavemula.com"
          echo "🌐 CloudFront distribution: E1NM1JU5WPCOK8"
          echo "🔗 Website URL: https://saiharshavemula.com"
